[package]
name = "haunt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal multiplexer with a tree-style tab sidebar"
license = "MIT"
repository = "https://github.com/alivanz/haunt"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
crossterm = { version = "0.29.0", features = ["serde"] }
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
